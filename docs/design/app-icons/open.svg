            <g transform="translate(-647.2 -565.2)">
              <path fill="#2C7FEB" d="M 627.02 565.20 A 20.17 20.17 0 1 0 667.36 565.20 A 20.17 20.17 0 1 0 627.02 565.20 Z"/>
