      <animateTransform attributeName="transform" type="scale" values="1 1;1 1;0.97 0.97;0.97 0.97;1.025 1.025;1 1;1 1" keyTimes="0;0.16;0.3;0.36;0.65;0.83;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="900ms" repeatCount="1" fill="freeze" additive="sum"/>
      <g transform="translate(-576 -583)">
        <path fill="none" stroke="#2C7FEB" stroke-width="42.71" stroke-linecap="round" d="M 752.41 620.50 A 180.35 180.35 0 1 1 655.06 420.90"/>
