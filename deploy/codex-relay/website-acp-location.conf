# Include inside the EXISTING website server block on 4090.
# Its public TLS/FRP edge must preserve WebSocket Upgrade.
# The Bridge authenticates this request and the hello using its private token.
# Never put that token in this public-facing configuration or website assets.
location = /health {
    proxy_pass http://127.0.0.1:18336;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Omnibot-Bridge-Token $http_x_omnibot_bridge_token;
    proxy_buffering off;
}

# These are the existing authenticated Bridge file APIs used by the app.
location ^~ /fs/ {
    proxy_pass http://127.0.0.1:18336;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Omnibot-Bridge-Token $http_x_omnibot_bridge_token;
    # Bridge defaults to 24 MiB decoded uploads; allow base64 + JSON overhead.
    client_max_body_size 36m;
    proxy_buffering off;
    proxy_read_timeout 900s;
}

location = /codex {
    proxy_pass http://127.0.0.1:18336;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Omnibot-Bridge-Token $http_x_omnibot_bridge_token;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
