        <path fill="none" stroke="#2C7FEB" stroke-width="32.04" stroke-linecap="round" d="M 725.06 457.49 A 94.92 94.92 0 0 1 766.67 542.81"/>
        <path fill="none" stroke="#2C7FEB" stroke-width="35.60" stroke-linecap="round" d="M 602.10 628.09 Q 634.14 651.82 666.17 625.71"/>
        <g transform="translate(538.0 579.4)">
          <g id="left_eye_blink">
            <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.48;1 0.48;1 1.04;1 1;1 1" keyTimes="0;0.16;0.3;0.36;0.65;0.83;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="900ms" repeatCount="1" fill="freeze" additive="sum"/>
            <g transform="translate(-538.0 -579.4)">
              <path fill="none" stroke="#2C7FEB" stroke-width="39.15" stroke-linecap="round" stroke-linejoin="round" d="M 509.56 536.73 L 566.51 579.44 L 509.56 622.15"/>
            </g>
          </g>
        </g>
        <g transform="translate(643.6 565.2)">
          <g id="right_eye_blink">
            <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.13;1 0.13;1 1.08;1 1;1 1" keyTimes="0;0.16;0.3;0.36;0.65;0.83;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="900ms" repeatCount="1" fill="freeze" additive="sum"/>
            <g transform="translate(-643.6 -565.2)">
              <path fill="#2C7FEB" d="M 623.46 565.20 A 20.17 20.17 0 1 0 663.80 565.20 A 20.17 20.17 0 1 0 623.46 565.20 Z"/>
