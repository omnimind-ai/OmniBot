  <title id="title">小万开屏眨眼动画 - 终端光标</title>
  <desc id="desc">小万开屏眨眼动画（cursor），900 毫秒单次眨眼并轻微回弹。Android 资源由 scripts/generate_splash_animation.py 生成。</desc>
