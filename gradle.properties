# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Some Flutter plugins still read the legacy AGP DSL. Remove this once all
# plugins have full AGP 9 new-DSL support.
android.newDsl=false
# Some Flutter plugins still apply the legacy Kotlin Gradle plugin.
android.builtInKotlin=false

# Lint configuration - 禁用 lint 错误中断构建
android.lint.abortOnError=false
#android.enableR8=true

# Optional account backend override for self-hosted deployments.
# Leave empty to use the official account service domain.
OMNIBOT_BASE_URL=

# Optional public OpenAI-compatible platform gateway override.
# Leave empty to use the official model gateway domain.
OMNIBOT_AI_GATEWAY_URL=

# Optional bundled image provider for first-party builds.
# Keep OMNIBOT_IMAGE_API_KEY out of git; set it in ~/.gradle/gradle.properties,
# CI secrets, or pass -POMNIBOT_IMAGE_API_KEY=... when building release APKs.
OMNIBOT_IMAGE_BASE_URL=https://cloud.omnimind.com.cn
OMNIBOT_IMAGE_MODEL=gpt-image-2
OMNIBOT_IMAGE_API_KEY=

# Public Cloudflare Worker URL used by Android clients for update checks.
# Example: https://omnibot-updates.example.workers.dev
OMNIBOT_UPDATE_WORKER_URL=https://omni.1775885.xyz

# Optional self-hosted terminal runtime manifest override. When empty, Ubuntu
# downloads directly from the pinned official Ubuntu Base HTTPS URL.
OMNIBOT_TERMINAL_RUNTIME_MANIFEST_URL=

