<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="96 96 960 960" role="img" aria-labelledby="title desc">
  <title id="title">小万开屏眨眼动画 - 灵光星芒</title>
  <desc id="desc">小万开屏眨眼动画（sparkle），900 毫秒单次眨眼并轻微回弹。Android 资源由 scripts/generate_splash_animation.py 生成。</desc>
